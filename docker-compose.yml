name: forja

services:
  nginx:
    image: nginx:1.30-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - forja

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - forja

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /app/data
      RP_ID: "${RP_ID:-localhost}"
      RP_NAME: "${RP_NAME:-FORJA}"
      EXPECTED_ORIGIN: "${EXPECTED_ORIGIN:-http://localhost:8080}"
      SESSION_SECRET: "${SESSION_SECRET:?SESSION_SECRET must be set}"
      SESSION_TTL_SECONDS: "${SESSION_TTL_SECONDS:-2592000}"
      AUTH_FLOW_TTL_SECONDS: "${AUTH_FLOW_TTL_SECONDS:-300}"
      VAPID_SUBJECT: "${VAPID_SUBJECT:?VAPID_SUBJECT must be set}"
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:?VAPID_PUBLIC_KEY must be set}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:?VAPID_PRIVATE_KEY must be set}"
      TRUST_PROXY: "1"
    expose:
      - "3000"
    volumes:
      - ${FORJA_DATA_DIR:-./data}:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 15s
    networks:
      - forja

networks:
  forja:
    driver: bridge
